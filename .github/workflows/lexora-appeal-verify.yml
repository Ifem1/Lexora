name: Lexora appeal verification

on:
  push:
    branches:
      - lexora/appeal-upgrade
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexora-appeal-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexora/appeal-upgrade
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install current stable GenLayer verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-test==0.29.2" "genvm-linter==0.11.0"
          python --version
          python - <<'PY'
          import importlib.metadata
          for package in ("genlayer-test", "genvm-linter", "genlayer-py"):
              print(f"{package}={importlib.metadata.version(package)}")
          PY
          genvm-lint --version || true
      - name: GenVM lint and schema
        run: |
          genvm-lint check contracts/LexoraArbitration.py
          genvm-lint schema contracts/LexoraArbitration.py --output /tmp/lexora-schema.json
          test -s /tmp/lexora-schema.json
      - name: Bridge linter runner cache to Direct Mode
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/gltest-direct"
          bundle="$(find "$HOME/.cache/genvm-linter" -maxdepth 1 -type f -name 'genvm-universal-*.tar.xz' | head -n 1)"
          test -n "$bundle"
          cp "$bundle" "$HOME/.cache/gltest-direct/"
          ls -lh "$HOME/.cache/gltest-direct"
      - name: Direct Mode
        run: python -m pytest tests/direct -vv

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexora/appeal-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
