name: Lexora appeal verification

on:
  push:
    branches:
      - lexora/appeal-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexora/appeal-upgrade
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install current stable GenLayer verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-test==0.29.2" "genvm-linter==0.11.0"
          python --version
          gltest --version || true
          genvm-lint --version || true
      - name: GenVM lint and schema
        run: |
          genvm-lint check contracts/LexoraArbitration.py
          genvm-lint schema contracts/LexoraArbitration.py --output /tmp/lexora-schema.json
          test -s /tmp/lexora-schema.json
      - name: Direct Mode
        run: python -m pytest tests/direct -vv

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexora/appeal-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
